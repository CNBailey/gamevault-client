name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the interface
        working-directory: web
        run: npm ci && npm run build

      - name: Linux build and end-to-end test
        run: |
          make -f Makefile.posix asan
          python3 tests/integration.py build/gamevault

      - name: Install the PS5 payload SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          tag=$(gh release list -R ps5-payload-dev/sdk -L 1 --json tagName -q '.[0].tagName')
          echo "SDK release: $tag"
          gh release download "$tag" -R ps5-payload-dev/sdk -p ps5-payload-sdk.zip -D /tmp
          unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Build gamevault.elf
        run: |
          make VERSION="$(git describe --tags --always)"
          ls -l gamevault.elf

      - uses: actions/upload-artifact@v4
        with:
          name: gamevault-elf
          path: gamevault.elf

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gamevault.elf
          generate_release_notes: true
