name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the interface
        working-directory: web
        run: npm ci && npm run build

      - name: Linux build and end-to-end test
        run: |
          make -f Makefile.posix asan
          python3 tests/integration.py build/gamevault

      - name: Install the PS5 payload SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          tag=$(gh release list -R ps5-payload-dev/sdk -L 1 --json tagName -q '.[0].tagName')
          echo "SDK release: $tag"
          gh release download "$tag" -R ps5-payload-dev/sdk -p ps5-payload-sdk.zip -D /tmp
          unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Build gamevault.elf
        run: |
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          make VERSION="$(cat VERSION)"
          ls -l gamevault.elf

      # A release is made for each new number in VERSION (pushed to main), or for a v* tag.
      - name: Is this version released yet?
        id: released
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gamevault-elf
          path: gamevault.elf

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || steps.released.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.VERSION) }}
          target_commitish: ${{ github.sha }}
          name: GameVault for PS5 ${{ env.VERSION }}
          files: gamevault.elf
          generate_release_notes: true
          make_latest: true
